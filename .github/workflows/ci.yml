name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+asyncpg://app:app@localhost:5432/app_test
      SECRET_KEY: ci-test-secret-key-en-az-32-karakter-uzun
      MARKET_SOURCE: replay # CI ASLA Binance'a bağlanmaz
      SYMBOLS: BTCUSDT,ETHUSDT,BNBUSDT,XRPUSDT,SOLUSDT
      FEE_RATE: "0.001"
      STARTING_CASH: "10000"
      DB_POOL: "null"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Migration en fazla bir head mi?
        run: test "$(alembic heads | wc -l)" -le 1
      - name: Migration ileri-geri-ileri
        run: alembic upgrade head && alembic downgrade base && alembic upgrade head
      - name: Testler
        run: pytest -q
      - name: API sözleşmesi güncel mi?
        run: |
          python -m app.export_openapi > /tmp/openapi.json
          diff -u ../docs/openapi.json /tmp/openapi.json

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Tip kontrolü
        run: npx tsc -b --noEmit
      - name: Birim testleri
        run: npx vitest run --passWithNoTests
      - name: Derleme
        run: npm run build
